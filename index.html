<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatemApp 360° | Golden Ratio Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --phi: 1.618;
        --phi-inv: 0.618;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        /* Golden Ratio Background Grid */
        background-image: 
          radial-gradient(#cbd5e1 0.5px, transparent 0.5px),
          linear-gradient(to right, #f1f5f9 1px, transparent 1px),
          linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
        background-size: 20px 20px, calc(20px * var(--phi)) calc(20px * var(--phi)), calc(20px * var(--phi)) calc(20px * var(--phi));
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .golden-card {
        aspect-ratio: 1.618 / 1;
      }
      .math-corner {
        position: absolute;
        width: 60px;
        height: 60px;
        opacity: 0.1;
        pointer-events: none;
      }
      @keyframes progress-indefinite {
        0% { width: 0%; margin-left: 0%; }
        50% { width: 50%; margin-left: 25%; }
        100% { width: 0%; margin-left: 100%; }
      }
      @keyframes rotate-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes golden-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.4), 0 0 40px rgba(234, 179, 8, 0.2); }
        50% { box-shadow: 0 0 40px rgba(234, 179, 8, 0.6), 0 0 60px rgba(234, 179, 8, 0.4); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes icon-pulse {
        0%, 100% { transform: scale(1.25); }
        50% { transform: scale(1.4); }
      }
      @keyframes fire-pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.1); filter: brightness(1.3); drop-shadow: 0 0 15px #f59e0b; }
      }
      @keyframes confetti-pop {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-100px) scale(0); opacity: 0; }
      }
      @keyframes pulse-indigo {
        0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        50% { box-shadow: 0 0 15px 2px rgba(99, 102, 241, 0.15); }
      }
      @keyframes pulse-amber {
        0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        50% { box-shadow: 0 0 30px 8px rgba(245, 158, 11, 0.25); }
      }
      .animate-progress-indefinite {
        animation: progress-indefinite 2s infinite ease-in-out;
      }
      .animate-rotate-slow {
        animation: rotate-slow 20s infinite linear;
      }
      .animate-golden-glow {
        animation: golden-glow 3s infinite ease-in-out;
      }
      .animate-float {
        animation: float 4s infinite ease-in-out;
      }
      .animate-icon-pulse {
        animation: icon-pulse 2.5s infinite ease-in-out;
      }
      .animate-fire {
        animation: fire-pulse 2s infinite ease-in-out;
      }
      .confetti-particle {
        position: absolute;
        pointer-events: none;
        animation: confetti-pop 1s forwards ease-out;
      }
      .bot-glow-flash {
        animation: pulse-indigo 3s infinite ease-in-out;
      }
      .bot-glow-pro {
        animation: pulse-amber 2s infinite ease-in-out;
        border-color: rgba(245, 158, 11, 0.3) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>
</head>
  <body class="text-slate-900">
    <div id="root"></div>
  </body>
</html>
